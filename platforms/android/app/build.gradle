import java.util.Properties

plugins {
    id 'com.android.application'
}

def duskRepoDir = rootProject.projectDir.parentFile.parentFile
def borealisDir = new File(duskRepoDir, 'extern/borealis')

ext.borealisAndroid = [
    borealisDir: borealisDir,
    propertiesFile: new File(duskRepoDir, 'build/android-arm64/borealis-android.properties'),
    namespace: 'dev.twilitrealm.dusk',
    applicationId: 'dev.twilitrealm.dusk',
    abis: ['arm64-v8a'],
    assets: [
        [
            from: new File(duskRepoDir, 'res'),
            into: 'res',
            excludes: ['**/.DS_Store']
        ],
        [
            from: new File(duskRepoDir, 'build/android-arm64/bundled_mods'),
            into: 'mods',
            includes: ['*.dusk']
        ]
    ],
    proguardRules: file('proguard-rules.pro')
]

apply from: new File(borealisDir, 'platforms/android/gradle/borealis-application.gradle')

def duskPropertiesFile = new File(duskRepoDir, 'build/android-arm64/dusk-android.properties')
def duskExtraNativeLibraries = []
if (duskPropertiesFile.isFile()) {
    def duskProperties = new Properties()
    duskPropertiesFile.withInputStream { duskProperties.load(it) }
    def value = duskProperties.getProperty('dusk.extraNativeLibraries')
    if (value) {
        duskExtraNativeLibraries = value.split(',').collect { project.file(it) }
    }
}
def duskJniLibsDir = layout.buildDirectory.dir('generated/jniLibs/dusk')
def stageDuskJniLibs = tasks.register('stageDuskJniLibs', Sync) {
    duskExtraNativeLibraries.each { library ->
        from(library) {
            into 'arm64-v8a'
        }
    }
    into(duskJniLibsDir)
    doFirst {
        duskExtraNativeLibraries.each { library ->
            if (!library.isFile()) {
                throw new GradleException(
                    "Native library is missing: ${library}. Build the CMake target first.")
            }
        }
    }
}
android.sourceSets.main.jniLibs.srcDirs += [duskJniLibsDir]
// adrenotools loads its hooks from the extracted native library directory.
android.packaging.jniLibs.useLegacyPackaging = true
tasks.named('preBuild').configure {
    dependsOn(stageDuskJniLibs)
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
